[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
offline = true
ffi = false
fs_permissions = []
remappings = ["v4-core/=lib/v4-core/", "forge-std/=lib/forge-std/src/", "solmate/=lib/solmate/"]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
